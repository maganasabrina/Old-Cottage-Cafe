
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabrina Nycole's Bakehouse</title>

  <meta name="description" content="Welcome to Sabrina Nycole's Bakehouse. A little cottage magic, homemade goodness, and simple coffee.">

  <meta name="theme-color" content="#1b0d09">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #160a07;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #160a07;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .website {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      line-height: 0;
      background: #21100c;
      box-shadow: 0 0 45px rgba(0, 0, 0, .8);
    }

    .website img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }

    @media (max-width: 600px) {
      .website {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="website">
    <img
      src="images/bakehouse-homepage.png"
      alt="Sabrina Nycole's Bakehouse — a rustic woodland cottage bakery website featuring dark mahogany wood, a forest cottage, coffee menu, homemade bakery treats, and complimentary samples."
      fetchpriority="high"
    >
  </main>

</body>
</html>
