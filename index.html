
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sabrina Nycole's Bakehouse</title>

<meta name="description" content="A little cottage magic. Homemade goodness, simple coffee, and rustic charm.">

<meta name="theme-color" content="#160905">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background: #160905;
  scroll-behavior: smooth;
}

body {
  background: #160905;
  font-family: Georgia, serif;
}

/* THE ORIGINAL ARTWORK */

.website {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  line-height: 0;
  box-shadow: 0 0 45px rgba(0,0,0,.85);
}

.website-art {
  display: block;
  width: 100%;
  height: auto;
}

/* INVISIBLE CLICKABLE AREAS */

.hotspot {
  position: absolute;
  display: block;
  z-index: 5;
  background: transparent;
  border: 0;
  cursor: pointer;
  border-radius: 5px;
  line-height: normal;
}

/* Keyboard accessibility */
.hotspot:focus-visible {
  outline: 3px solid #e6c18f;
  outline-offset: 3px;
  background: rgba(240,210,165,.12);
}

/* NAVIGATION AREAS
   Coordinates are percentages of the artwork.
*/

/* Logo / home */
.home {
  left: 8%;
  top: 2%;
  width: 30%;
  height: 12%;
}

/* Top navigation */
.nav-home {
  left: 45%;
  top: 2%;
  width: 8%;
  height: 4%;
}

.nav-story {
  left: 55%;
  top: 2%;
  width: 11%;
  height: 4%;
}

.nav-coffee {
  left: 66%;
  top: 2%;
  width: 9%;
  height: 4%;
}

.nav-bakery {
  left: 76%;
  top: 2%;
  width: 9%;
  height: 4%;
}

.nav-contact {
  left: 86%;
  top: 2%;
  width: 11%;
  height: 4%;
}

/* Come on in */
.come-in {
  left: 30%;
  top: 26%;
  width: 25%;
  height: 4%;
}

/* Story panel */
.story {
  left: 8%;
  top: 31%;
  width: 46%;
  height: 19%;
}

/* Coffee menu */
.coffee {
  left: 5%;
  top: 51%;
  width: 51%;
  height: 22%;
}

/* Bring your own cup */
.byo {
  left: 59%;
  top: 53%;
  width: 37%;
  height: 18%;
}

/* Bakery photographs */
.bakery {
  left: 5%;
  top: 76%;
  width: 65%;
  height: 14%;
}

/* Complimentary samples */
.samples {
  left: 69%;
  top: 75%;
  width: 27%;
  height: 15%;
}

/* Footer / visit */
.visit {
  left: 68%;
  top: 91%;
  width: 29%;
  height: 7%;
}

/* Small screen adjustments */
@media (max-width: 600px) {
  .website {
    width: 100%;
  }
}

/* Optional hover indication for desktop */
@media (hover: hover) {
  .hotspot:hover {
    background: rgba(255,220,170,.035);
  }
}
</style>
</head>

<body>

<main class="website">

  <!-- EXACT ORIGINAL WEBSITE ARTWORK -->
  <img
    class="website-art"
    src="Images/bakehouse-homepage.png"
    alt="Sabrina Nycole's Bakehouse: a rustic woodland cottage bakery with dark mahogany wood, forest greenery, parchment panels, coffee menu, and homemade baked treats."
  >

  <!-- CLICKABLE NAVIGATION -->

  <a class="hotspot home"
     href="#home"
     aria-label="Home"></a>

  <a class="hotspot nav-home"
     href="#home"
     aria-label="Home"></a>

  <a class="hotspot nav-story"
     href="#story"
     aria-label="Our Story"></a>

  <a class="hotspot nav-coffee"
     href="#coffee"
     aria-label="Coffee menu"></a>

  <a class="hotspot nav-bakery"
     href="#bakery"
     aria-label="Bakery"></a>

  <a class="hotspot nav-contact"
     href="#contact"
     aria-label="Contact"></a>

  <!-- CLICKABLE DESIGN AREAS -->

  <a class="hotspot come-in"
     href="#story"
     aria-label="Come on in"></a>

  <a class="hotspot story"
     href="#story"
     aria-label="Read our story"></a>

  <a class="hotspot coffee"
     href="#coffee"
     aria-label="View coffee menu"></a>

  <a class="hotspot byo"
     href="#coffee"
     aria-label="Bring your own cup information"></a>

  <a class="hotspot bakery"
     href="#bakery"
     aria-label="Explore the bakery"></a>

  <a class="hotspot samples"
     href="#samples"
     aria-label="Complimentary bakery samples"></a>

  <a class="hotspot visit"
     href="mailto:YOUR-EMAIL-HERE"
     aria-label="Contact Sabrina Nycole's Bakehouse"></a>

</main>

<!-- These destinations allow the navigation links to work.
     They do not change the appearance of the artwork. -->

<div id="home"></div>
<div id="story"></div>
<div id="coffee"></div>
<div id="bakery"></div>
<div id="samples"></div>
<div id="contact"></div>

</body>
</html>
