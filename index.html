
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabrina Nycole's Bakehouse</title>
<meta name="description" content="A little cottage magic. Homemade goodness, simple coffee, and rustic charm.">
<meta name="theme-color" content="#160905">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background: #160905;
  scroll-behavior: smooth;
  scroll-padding-top: 15px;
}

body {
  background: #160905;
  font-family: Georgia, serif;
}

/* ORIGINAL ARTWORK */

.website {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  line-height: 0;
  box-shadow: 0 0 45px rgba(0,0,0,.85);
}

.website-art {
  display: block;
  width: 100%;
  height: auto;
}

/* CLICKABLE AREAS */

.hotspot {
  position: absolute;
  display: block;
  z-index: 5;
  background: transparent;
  border: 0;
  cursor: pointer;
  border-radius: 5px;
  line-height: normal;
}

.hotspot:focus-visible {
  outline: 3px solid #e6c18f;
  outline-offset: 3px;
  background: rgba(240,210,165,.12);
}

/* NAVIGATION */

.home {
  left: 8%;
  top: 2%;
  width: 30%;
  height: 12%;
}

.nav-home {
  left: 45%;
  top: 2%;
  width: 8%;
  height: 4%;
}

.nav-story {
  left: 55%;
  top: 2%;
  width: 11%;
  height: 4%;
}

.nav-coffee {
  left: 66%;
  top: 2%;
  width: 9%;
  height: 4%;
}

.nav-bakery {
  left: 76%;
  top: 2%;
  width: 9%;
  height: 4%;
}

.nav-contact {
  left: 86%;
  top: 2%;
  width: 11%;
  height: 4%;
}

/* MAIN ARTWORK AREAS */

.come-in {
  left: 30%;
  top: 26%;
  width: 25%;
  height: 4%;
}

.story {
  left: 8%;
  top: 31%;
  width: 46%;
  height: 19%;
}

.coffee {
  left: 5%;
  top: 51%;
  width: 51%;
  height: 22%;
}

.byo {
  left: 59%;
  top: 53%;
  width: 37%;
  height: 18%;
}

.bakery {
  left: 5%;
  top: 76%;
  width: 65%;
  height: 14%;
}

.samples {
  left: 69%;
  top: 75%;
  width: 27%;
  height: 15%;
}

.visit {
  left: 68%;
  top: 91%;
  width: 29%;
  height: 7%;
}

@media (hover: hover) {
  .hotspot:hover {
    background: rgba(255,220,170,.035);
  }
}
</style>
</head>

<body>

<main class="website" id="home">

  <img
    class="website-art"
    src="images/bakehouse-homepage.png"
    alt="Sabrina Nycole's Bakehouse original rustic woodland bakery website artwork"
  >

  <!-- HOME -->
  <a class="hotspot home" href="#home" aria-label="Home"></a>
  <a class="hotspot nav-home" href="#home" aria-label="Home"></a>

  <!-- STORY -->
  <a class="hotspot nav-story" href="#story" aria-label="Our Story"></a>
  <a class="hotspot come-in" href="#story" aria-label="Come on in"></a>
  <a class="hotspot story" href="#story" aria-label="Our Story"></a>

  <!-- COFFEE -->
  <a class="hotspot nav-coffee" href="#coffee" aria-label="Coffee"></a>
  <a class="hotspot coffee" href="#coffee" aria-label="Coffee menu"></a>
  <a class="hotspot byo" href="#coffee" aria-label="Bring your own cup"></a>

  <!-- BAKERY -->
  <a class="hotspot nav-bakery" href="#bakery" aria-label="Bakery"></a>
  <a class="hotspot bakery" href="#bakery" aria-label="Bakery"></a>
  <a class="hotspot samples" href="#samples" aria-label="Bakery samples"></a>

  <!-- CONTACT -->
  <a class="hotspot nav-contact" href="#contact" aria-label="Contact"></a>
  <a class="hotspot visit" href="#contact" aria-label="Visit us"></a>

</main>

<!-- NAVIGATION DESTINATIONS POSITIONED RELATIVE TO ARTWORK -->

<div id="story" style="position:absolute;top:31%;left:0;width:1px;height:1px;"></div>
<div id="coffee" style="position:absolute;top:91%;left:0;width:1px;height:1px;"></div>
<div id="bakery" style="position:absolute;top:175%;left:0;width:1px;height:1px;"></div>
<div id="samples" style="position:absolute;top:175%;left:0;width:1px;height:1px;"></div>
<div id="contact" style="position:absolute;top:200%;left:0;width:1px;height:1px;"></div>

</body>
</html>
